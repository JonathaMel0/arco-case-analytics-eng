name: 'arco_analytics'
version: '1.0.0'
config-version: 2

profile: 'arco_analytics'

model-paths: ["models"]
seed-paths: ["seeds"]
macro-paths: ["macros"]

target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  arco_analytics:
    clean:
      +materialized: view
      +schema: clean
    curated:
      +materialized: table
      +schema: curated
    report:
      +materialized: table
      +schema: report
